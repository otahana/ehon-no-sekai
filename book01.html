
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぼくはカエル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: "Kiwi Maru", serif;
            background-color: #ffffff;
        }

        .page-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 28px 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        h1 {
            color: #AF8D68;
            border-bottom: 1.8px solid #916d00a3;
            font-size: clamp(20px, 3vh, 28px);
            padding-bottom: 4px;
        }

        .nav-buttons button {
            padding: 10px 26px;
            background-color: #194E00;
            color: #fff;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            font-family: "Kiwi Maru", serif;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .nav-buttons button:hover {
            transform: scale(1.05);
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 4vw, 48px);
            min-height: 0;
            padding: 8px 0;
        }

        .camera {
            flex: 1;
            max-width: 280px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        video {
            border-radius: 50%;
            width: clamp(120px, 20vh, 175px);
            height: clamp(120px, 20vh, 175px);
            object-fit: cover;
            border: 3px solid #AF8D68;
            background-color: #f6f4ef;
        }

        .gesture-guides {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gesture-guides img {
            width: clamp(80px, 13vh, 120px);
            height: auto;
            object-fit: contain;
        }

        .camera p {
            font-size: clamp(13px, 1.8vh, 15px);
            font-weight: bold;
            color: #AF8D68;
            text-align: center;
            line-height: 1.6;
        }

        .ehon {
            flex: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-height: 0;
        }

        #storybook {
            max-width: 100%;
            max-height: 46vh;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: pointer;
        }

        .page {
            font-size: clamp(16px, 2.5vh, 22px);
            line-height: 1.6;
            background: #ffffff;
            padding: clamp(12px, 2vh, 20px) 24px;
            border-radius: 16px;
            width: 92%;
            max-width: 680px;
            min-height: 12vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header>
            <h1>ぼくはカエル</h1>
            <div class="nav-buttons">
                <button onclick="window.location.href='title.html'">おわる</button>
            </div>
        </header>

        <section class="main">
            <div class="camera">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="gesture-guides">
                    <img src="img/1x/handsUp.png" alt="手のポーズ">
                    <img class="gif" src="img/1x/handsUp.gif" alt="動き方GIF">
                </div>
                <p>よめたら<br>うごきを まねして<br>つぎの ページに すすもう！</p>
            </div>

            <div class="ehon">
                <img id="storybook" src="img/bookclose.png" alt="絵本ページ" title="クリックでもめくれます">
                <div class="page" id="page-text">&nbsp;</div>
            </div>
        </section>

        <footer>
            <audio id="bgm" src="audio/bgm.mp3" loop></audio>
            <audio id="narration"></audio>
            &copy; 2025 えほんはいいぞ
        </footer>
    </div>

    <script>
        const pageImages = [
            "bookclose.png",
            "bookopen.gif",
            "00001.jpg",
            "bookopen.gif",
            "00002.jpg",
            "bookopen.gif",
            "00003.jpg",
            "bookopen.gif",
            "00004.jpg",
            "bookopen.gif",
            "00005.jpg",
            "bookopen.gif",
            "bookclose.png"
        ];

        const pageTexts = [
            "ぼくはカエル",
            "",
            "あさですよ。<br>ぴかぴか おひさまが おしえてる。",
            "",
            "もぐもぐ もぐもぐ<br>あさごはん おいしいな！",
            "",
            "きょうは なにを きようかな？<br>あれも これも それもいい。",
            "",
            "これで じゅんびは できた。<br>きょうは つり でもしようかな？",
            "",
            "ぷかぷか うきが ういている。<br>おさかな いっぱい つれるかな。",
            "",
            "つづく。<br>また よんでね。"
        ];

        const book = document.getElementById("storybook");
        const pageTextElement = document.getElementById("page-text");
        const narration = document.getElementById("narration");
        const video = document.getElementById("webcam");
        const bgm = document.getElementById("bgm");

        let currentPage = 0;
        let isAnimating = false;
        let lastGestureTime = 0;

        function isCooldownActive() {
            const now = Date.now();
            if (now - lastGestureTime < 2000) return true;
            lastGestureTime = now;
            return false;
        }

        function updatePage() {
            isAnimating = true;
            const image = pageImages[currentPage];
            book.src = `img/${image}`;
            pageTextElement.innerHTML = pageTexts[currentPage] || "&nbsp;";

            if (pageTexts[currentPage]) {
                narration.src = `audio/page${Math.floor((currentPage + 1) / 2)}.mp3`;
                narration.play().catch(() => {});
            }

            const delay = image.includes(".gif") ? 2000 : 0;
            if (delay > 0) {
                setTimeout(() => {
                    isAnimating = false;
                    nextPage();
                }, delay);
            } else {
                isAnimating = false;
            }
        }

        function nextPage() {
            if (isAnimating || currentPage >= pageImages.length - 1) return;
            currentPage++;
            updatePage();
        }

        book.addEventListener("click", () => {
            if (!isCooldownActive()) nextPage();
        });

        async function startPoseDetection() {
            const detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
            const detect = async () => {
                const poses = await detector.estimatePoses(video);
                if (poses.length > 0) {
                    const keypoints = poses[0].keypoints;
                    const leftWrist = keypoints.find(k => k.name === "left_wrist");
                    const rightWrist = keypoints.find(k => k.name === "right_wrist");
                    const nose = keypoints.find(k => k.name === "nose");
                    const handsUp = (leftWrist && nose && leftWrist.y < nose.y) || (rightWrist && nose && rightWrist.y < nose.y);

                    if (handsUp && !isCooldownActive()) nextPage();
                }
                requestAnimationFrame(detect);
            };
            detect();
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    tf.setBackend('webgl').then(() => startPoseDetection());
                };
            }).catch(err => {
                console.warn("カメラが使用できない環境です:", err);
            });
        }

        bgm.play().catch(() => {});
        updatePage();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>えほんのせかい</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #ffffff;
            text-align: center;
            font-family: "Kiwi Maru", serif;
        }

        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: #194E00;
            padding: 22px 16px 26px;
            box-shadow: 0 4px 8px rgba(11, 11, 11, 0.12);
            border-bottom-left-radius: 48px;
            border-bottom-right-radius: 48px;
            flex-shrink: 0;
        }

        h1 {
            color: #fff;
            font-size: clamp(22px, 3.6vw, 34px);
            letter-spacing: 0.55em;
            padding-left: 0.55em;
        }

        .subtitle-section {
            padding-top: 8px;
            flex-shrink: 0;
        }

        p.subtitle {
            font-size: clamp(15px, 2vh, 20px);
            color: #916C00;
            letter-spacing: 0.25em;
            border-bottom: 1.8px solid #916d00a3;
            display: inline-block;
            padding-bottom: 4px;
            font-weight: 700;
        }

        .menu-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            min-height: 0;
        }

        .book-menu {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: flex-start;
            gap: clamp(20px, 5vw, 72px);
            width: 100%;
            max-width: 960px;
        }

        .book-menu a {
            text-decoration: none;
            text-align: center;
            flex: 1;
            max-width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .book-img {
            width: auto;
            height: 22vh;
            max-height: 150px;
            object-fit: contain;
            transition: transform 0.25s ease;
        }

        .book-img:hover {
            transform: scale(1.08);
        }

        .book-title {
            display: block;
            margin-top: 8px;
            font-size: clamp(13px, 1.8vh, 15px);
            font-weight: bold;
            line-height: 1.35;
        }

        .title-green { color: #AF8D68; }
        .title-blue { color: #6894AF; }
        .title-pink { color: #B2AB67; }
        .title-orange { color: #AF6888; }

        footer {
            padding: 6px 16px 12px;
            font-size: 0.8rem;
            color: #888;
            flex-shrink: 0;
        }

        #continue-btn-container a {
            display: inline-block;
            padding: 10px 30px;
            background-color: #194E00;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>えほんのせかい</h1>
        </header>

        <section class="subtitle-section">
            <p class="subtitle">すきな えほんを えらぼう</p>
        </section>

        <section class="menu-section">
            <div class="book-menu">
                <a href="book01.html">
                    <img src="img/1x/book01.png" alt="ぼくはカエル" class="book-img">
                    <span class="book-title title-green">ぼくはカエル</span>
                </a>
                <a href="book02.html">
                    <img src="img/1x/book02.png" alt="きみはだれ？" class="book-img">
                    <span class="book-title title-blue">きみはだれ？</span>
                </a>
                <a href="book03.html">
                    <img src="img/1x/book03.png" alt="きみのこえ" class="book-img">
                    <span class="book-title title-pink">きみのこえ</span>
                </a>
                <a href="book04.html">
                    <img src="img/1x/book04.png" alt="ぼくのともだち ぐわぐわ" class="book-img">
                    <span class="book-title title-orange">ぼくのともだち<br>ぐわぐわ</span>
                </a>
            </div>
        </section>

        <footer>
            <div id="continue-btn-container"></div>
            &copy; 2025 えほんはいいぞ
        </footer>
    </main>

    <script>
        const lastPage = localStorage.getItem("lastPage");
        if (lastPage && lastPage !== window.location.href) {
            const container = document.getElementById("continue-btn-container");
            const button = document.createElement("a");
            button.href = lastPage;
            button.textContent = "▶ つづき";
            container.appendChild(button);
        }
    </script>
</body>
</html>
